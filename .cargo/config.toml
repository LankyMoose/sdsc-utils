# Cargo-local configuration (checked in; applies to every local and CI build).

# CEF's `libcef_dll_wrapper` is compiled with the static MSVC runtime (/MT),
# and CEF's process sandbox requires /MT as well. Rust's MSVC default is the
# dynamic CRT (/MD), which produces LNK2038/LNK2005 at the final link. Use the
# static CRT for every Windows target so the wrapper, our C++/Rust code, and
# CEF's own binaries agree.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
