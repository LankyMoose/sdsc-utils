name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Pinned to rust-toolchain.toml: the action defaults to floating
          # `stable`, which broke CI on the 1.99 fetch_update rename while
          # local dev lagged behind. Bump both files together.
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format, Clippy, Test
        shell: bash
        run: bash scripts/ci.sh

  msrv:
    name: MSRV floor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          # Must track `rust-version` in Cargo.toml. Only a compile check:
          # it enforces the floor claim against the exact committed
          # dependency set, nothing more.
          toolchain: 1.88

      - name: Check MSRV floor
        shell: bash
        run: cargo +1.88 check --locked --all-targets
