name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Pinned to rust-toolchain.toml: the action defaults to floating
          # `stable`, which broke CI on the 1.99 fetch_update rename while
          # local dev lagged behind. Bump both files together.
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Install Servo build prerequisites (Clang; Python is preinstalled)
        shell: bash
        run: |
          choco install llvm --no-progress -y
          echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
          # Stylo codegen wants `python.exe` on PATH or PYTHON3; pin it so a
          # PATH surprise fails here instead of inside the Servo build.
          echo "PYTHON3=$(cygpath -w "$(which python)")" >> "$GITHUB_ENV"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format, Clippy, Test
        shell: bash
        run: bash scripts/ci.sh

      - name: sccache stats
        shell: bash
        run: $SCCACHE_PATH --show-stats

  msrv:
    name: MSRV floor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@stable
        with:
          # Must track `rust-version` in Cargo.toml. Only a compile check:
          # it enforces the floor claim against the exact committed
          # dependency set, nothing more. Scoped to `--no-default-features`:
          # the default-on Servo engine needs the pinned toolchain.
          toolchain: 1.89

      - name: Check MSRV floor (app code only; the default-on engine needs a newer rustc)
        shell: bash
        run: cargo +1.89 check --locked --all-targets --no-default-features
