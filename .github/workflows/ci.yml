name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Pinned to rust-toolchain.toml: the action defaults to floating
          # `stable`, which broke CI on the 1.99 fetch_update rename while
          # local dev lagged behind. Bump both files together.
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format, Clippy, Test
        shell: bash
        run: bash scripts/ci.sh
