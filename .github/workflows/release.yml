name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: sdsc-utils-windows
          path: |
            target/release/sdsc-utils.exe
            target/release/sdsc-shell.exe

      - name: Pack MSIX
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          ./packaging/pack-msix.ps1 -ExePath target/release/sdsc-utils.exe -OutDir target/msix -RepoRoot $env:GITHUB_WORKSPACE

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: sdsc-utils-msix
          path: target/msix/sdsc-utils.msix

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/sdsc-utils.exe
            target/release/sdsc-shell.exe
            target/msix/sdsc-utils.msix
          generate_release_notes: true
