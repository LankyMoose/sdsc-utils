[package]
name = "sdsc-utils"
version = "1.7.3"
edition = "2024"
rust-version = "1.89"
description = "SDSC Utils â€” system tray battery, lightbar, and identify utilities for DualSense controllers"
authors = ["LankyMoose"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/LankyMoose/sdsc-utils"
homepage = "https://github.com/LankyMoose/sdsc-utils"
keywords = ["dualsense", "playstation", "battery", "hid", "tray"]
categories = ["hardware-support", "gui"]
build = "build.rs"
default-run = "sdsc-utils"

[lib]
name = "sdsc_utils"
path = "src/lib.rs"

[[bin]]
name = "sdsc-utils"
path = "src/bin/sdsc-utils.rs"

[[bin]]
name = "gen_msix_logos"
path = "src/bin/gen_msix_logos.rs"

[features]
# Single executable: the engine-rendered browser (Servo offscreen → iced
# texture) is on by default. Servo's SpiderMonkey build needs Clang + Python
# at build time and dominates clean-build time, so `--no-default-features`
# (or `SDSC_NO_ENGINE=1` at runtime) is the fast UI-only fallback.
default = ["servo-engine"]
servo-engine = ["dep:servo", "dep:dpi", "dep:euclid", "dep:url", "dep:surfman", "dep:embedder_traits"]

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }
windows = { version = "0.61", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Gaming_Input",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
crc32fast = "1.5.0"
hidapi = "2.6.6"
iced = { version = "0.14.0", features = [
    "advanced",
    "canvas",
    "tokio",
    "svg",
    "image",
] }
wgpu = "27"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "ico",
] }
png = "0.17"
resvg = { version = "0.45", default-features = false }
rfd = "0.15"
rodio = { version = "0.20", default-features = false, features = ["mp3"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
# Servo defaults minus devtools: `bundled` (fonts/resources), `clipboard`,
# `js_jit` and `multiprocess` stay (page performance); `default_tooling`
# (the remote-debugging server) is pure build cost with no runtime effect.
servo = { version = "0.8.0", optional = true, default-features = false, features = [
    "bundled",
    "clipboard",
    "js_jit",
    "multiprocess",
] }
surfman = { version = "0.14", optional = true }
url = { version = "2", optional = true }
dpi = { version = "0.1", optional = true }
embedder_traits = { package = "servo-embedder-traits", version = "0.8.0", optional = true }
euclid = { version = "0.22", optional = true }
keyboard-types = "0.8"
serde_json = "1"
single-instance = "0.3.3"
notify-rust = "4"
ureq = { version = "3", features = ["rustls"] }

[build-dependencies]
ico = "0.4"
resvg = { version = "0.45", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }

[profile.dev]
# Link time dominates engine builds (one ~250MB binary), so keep debuginfo
# minimal for iteration: line tables for our own code (usable panics and
# backtraces), none for dependencies. This also compiles the mozjs C++ objects
# without `-g` (build scripts see `DEBUG=false`), which shrinks objects and
# speeds both compile and link. Release profiles are untouched.
debug = "line-tables-only"
codegen-units = 256
incremental = true

[profile.dev.package."*"]
debug = false

[profile.dev.package."sdsc-utils"]
debug = "line-tables-only"
