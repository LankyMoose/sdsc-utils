[package]
name = "sdsc-utils"
version = "1.3.3"
edition = "2024"
rust-version = "1.88"
description = "SDSC Utils — system tray battery, lightbar, and identify utilities for DualSense controllers"
authors = ["LankyMoose"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/LankyMoose/sdsc-utils"
homepage = "https://github.com/LankyMoose/sdsc-utils"
keywords = ["dualsense", "playstation", "battery", "hid", "tray"]
categories = ["hardware-support", "gui"]
build = "build.rs"

[features]
default = []
dev-emulate = []

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }
windows = { version = "0.61", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Gaming_Input",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[dependencies]
crc32fast = "1.5.0"
hidapi = "2.6.6"
iced = { version = "0.14.0", features = ["canvas", "tokio", "svg", "image"] }
png = "0.17"
resvg = { version = "0.45", default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
single-instance = "0.3.3"

[build-dependencies]
ico = "0.4"
resvg = { version = "0.45", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }
