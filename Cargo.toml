[package]
name = "sdsc-utils"
version = "1.6.0"
edition = "2024"
rust-version = "1.88"
description = "SDSC Utils â€” system tray battery, lightbar, and identify utilities for DualSense controllers"
authors = ["LankyMoose"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/LankyMoose/sdsc-utils"
homepage = "https://github.com/LankyMoose/sdsc-utils"
keywords = ["dualsense", "playstation", "battery", "hid", "tray"]
categories = ["hardware-support", "gui"]
build = "build.rs"
default-run = "sdsc-utils"

[lib]
name = "sdsc_utils"
path = "src/lib.rs"

[[bin]]
name = "sdsc-utils"
path = "src/bin/sdsc-utils.rs"

[[bin]]
name = "sdsc-shell"
path = "src/bin/sdsc-shell.rs"

[[bin]]
name = "gen_msix_logos"
path = "src/bin/gen_msix_logos.rs"

[features]
default = []
dev-emulate = []

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }
windows = { version = "0.61", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Gaming_Input",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1.5.0"
hidapi = "2.6.6"
iced = { version = "0.14.0", features = [
    "advanced",
    "canvas",
    "tokio",
    "svg",
    "image",
] }
wgpu = "27"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "ico",
] }
png = "0.17"
resvg = { version = "0.45", default-features = false }
rfd = "0.15"
rodio = { version = "0.20", default-features = false, features = ["mp3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
single-instance = "0.3.3"

[build-dependencies]
ico = "0.4"
resvg = { version = "0.45", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }
