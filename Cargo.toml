[package]
name = "sdsc-utils"
version = "1.7.3"
edition = "2024"
rust-version = "1.89"
description = "SDSC Utils â€” system tray battery, lightbar, and identify utilities for DualSense controllers"
authors = ["LankyMoose"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/LankyMoose/sdsc-utils"
homepage = "https://github.com/LankyMoose/sdsc-utils"
keywords = ["dualsense", "playstation", "battery", "hid", "tray"]
categories = ["hardware-support", "gui"]
build = "build.rs"
default-run = "sdsc-utils"

[workspace]
members = ["crates/browser-protocol"]
default-members = [".", "crates/browser-protocol"]
resolver = "3"

[lib]
name = "sdsc_utils"
path = "src/lib.rs"

[[bin]]
name = "sdsc-utils"
path = "src/bin/sdsc-utils.rs"

[[bin]]
name = "gen_msix_logos"
path = "src/bin/gen_msix_logos.rs"

[[bin]]
name = "sdsc-browser"
path = "src/bin/sdsc-browser.rs"

[features]
# Single executable with CEF OSR in-process. `--no-default-features` is the
# UI-only iteration build (Browser tile shows the engine install state); it
# never falls back to a reader/text page.
default = ["cef-engine"]
cef-engine = ["dep:cef"]
# QA builds may point the release-check and engine DLC at a local mock feed.
# Never enabled in normal release/Store builds.
qa-feed = []

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }
windows = { version = "0.61", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Gaming_Input",
    "Management_Deployment",
    "Storage_Search",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[dependencies]
cef = { version = "156.7.0", optional = true, default-features = false }
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
crc32fast = "1.5.0"
hidapi = "2.6.6"
iced = { version = "0.14.0", features = [
    "advanced",
    "canvas",
    "tokio",
    "svg",
    "image",
] }
# Custom GPU primitives for the stable browser-frame texture (same pattern
# as the video preview in valorant-companion).
iced_wgpu = "0.14"
wgpu = "27"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "ico",
] }
png = "0.17"
resvg = { version = "0.45", default-features = false }
rfd = "0.15"
rodio = { version = "0.20", default-features = false, features = ["mp3"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
url = "2"
keyboard-types = "0.8"
serde_json = "1"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
single-instance = "0.3.3"
notify-rust = "4"
ureq = { version = "3", features = ["rustls"] }
sdsc-browser-protocol = { path = "crates/browser-protocol" }

[build-dependencies]
ico = "0.4"
resvg = { version = "0.45", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }

[profile.dev]
# Link time dominates engine builds (one ~250MB binary), so keep debuginfo
# minimal for iteration: line tables for our own code (usable panics and
# backtraces), none for dependencies (build scripts see `DEBUG=false`),
# which shrinks objects and speeds both compile and link. Release profiles are
# untouched.
debug = "line-tables-only"
codegen-units = 256
incremental = true

[profile.dev.package."*"]
debug = false

[profile.dev.package."sdsc-utils"]
debug = "line-tables-only"

[dev-dependencies]
# Headless WGSL validation: the browser-frame pipeline builds on the first
# painted frame, so a shader typo would panic the app instead of failing a test.
naga = { version = "27.0.3", default-features = false, features = ["wgsl-in"] }
