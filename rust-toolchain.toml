# Single source of truth for the Rust toolchain, local and CI alike.
#
# - `rust-version` in Cargo.toml (1.88) is the MSRV *floor* and stays: the
#   code must keep building there (let-chains need 1.88).
# - This file pins the *actual* compiler local dev builds and tests with
#   (rustup auto-installs it). CI does NOT follow this file — the dtolnay
#   action defaults to floating `stable` — so ci.yml pins the same version
#   explicitly via its `toolchain:` input. Bump BOTH files together.
# - Bump deliberately: edit both pins, run scripts/ci.sh, commit. The bump
#   commit itself surfaces any new lints under -D warnings. Never float.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy", "rust-src"]
